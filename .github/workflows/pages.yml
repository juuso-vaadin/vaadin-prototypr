# Builds manifest.json and deploys the site to GitHub Pages (SPEC.md §7).
# Repository settings: Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: prototype versions come from git log (§4.3)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build manifest
        run: node scripts/build-manifest.mjs --strict
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html viewer prototypes vendor manifest.json site.config.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
